<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Aube : Geist comme police par défaut pour les applis hors Qt (GTK, Flatpak, navigateurs). -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Geist</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>Geist Mono</family>
    </prefer>
  </alias>
</fontconfig>
